<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>plain-zw</title>
<div id="ed" contenteditable="true" style="border:1px solid #888;min-height:3em;font-size:20px"></div>
<button id="outside" style="font-size:20px;margin:16px 0">Outside</button>
<pre id="log" style="font-size:10px"></pre>
<script>
  // Control: the empty state holds a zero-width no-break space, as the editor's empty block does.
  const ed = document.getElementById('ed')
  ed.textContent = '\uFEFF'
  const events = []
  for (const t of ['beforeinput', 'input', 'compositionstart', 'compositionupdate', 'compositionend']) {
    ed.addEventListener(t, (e) => {
      events.push({type: t, inputType: e.inputType, data: e.data, text: ed.textContent})
      document.getElementById('log').textContent = events.map((x) => JSON.stringify(x)).join('\n')
    })
  }
  window.__state = () => ({text: ed.textContent.replace(/\uFEFF/g, ''), events})
</script>
