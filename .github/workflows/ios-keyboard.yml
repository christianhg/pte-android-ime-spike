name: ios-keyboard

on:
  push:
    branches: [ios-keyboard-spike]
  workflow_dispatch:
    inputs:
      langs:
        description: JSON list of languages
        default: '["en", "ja"]'
      attempts:
        description: JSON list of attempt numbers
        default: '[1, 2, 3, 4, 5]'
      cases_en:
        description: English cases
        default: kyou autocorrect edit actions interrupt
      cases_ja:
        description: Japanese cases
        default: kyou interrupt

jobs:
  simulator:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15]
        lang: ${{ fromJSON(inputs.langs || '["en", "ja"]') }}
        attempt: ${{ fromJSON(inputs.attempts || '[1, 2, 3, 4, 5]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Versions
        run: |
          mkdir -p out
          echo "START at $(date +%s)" | tee out/timing.txt
          sw_vers; xcodebuild -version
          xcrun simctl list runtimes available

      - name: Build test page
        working-directory: page
        run: |
          npm pkg set "dependencies.@portabletext/editor=latest"
          npm install --no-audit --no-fund --no-package-lock && npm run build
          node -e "console.log('EDITOR_VERSION', require('./node_modules/@portabletext/editor/package.json').version)"
          # Second build from a packed branch tarball, served under /fix/.
          mv dist dist-main
          npm pkg set "dependencies.@portabletext/editor=file:tarballs/placeholder-after-text-d3173ff85.tgz"
          npm install --no-audit --no-fund --no-package-lock && npm run build
          node -e "console.log('FIX_EDITOR_VERSION', require('./node_modules/@portabletext/editor/package.json').version)"
          mv dist dist-main/fix && mv dist-main dist
          ls dist dist/fix

      - name: Install Appium and the XCUITest driver
        working-directory: ios
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npx appium --version
          npx appium driver install xcuitest
          npx appium driver list --installed

      - name: Set up the simulator
        run: ios/setup-sim.sh ${{ matrix.lang }} out

      - name: Type on the software keyboard
        working-directory: ios
        env:
          LANG_CASE: ${{ matrix.lang }}
          CASES_EN: ${{ inputs.cases_en }}
          CASES_JA: ${{ inputs.cases_ja }}
        run: |
          node ../scripts/serve.ts ../page/dist 8765 > ../out/http.log 2>&1 &
          npx appium --log ../out/appium.log --log-level info > /dev/null 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status > /dev/null && break; sleep 2; done
          echo "APPIUM up at $(date +%s)" | tee -a ../out/timing.txt
          status=0
          if [ "$LANG_CASE" = en ]; then cases="${CASES_EN:-kyou autocorrect edit actions interrupt}"; else cases="${CASES_JA:-kyou interrupt}"; fi
          for c in $cases; do
          for args in "plain.html ''" "plain-zw.html ''" "editor.html ''" "editor.html?placeholder=Write ''" "fix/editor.html ''" "fix/editor.html?placeholder=Write ''" "editor.html x"; do
            eval "set -- $args"
            node drive.ts "$1" "$2" "$LANG_CASE" ../out "$c" 2>&1 | tee -a ../out/drive.log
            [ "${PIPESTATUS[0]}" -ne 0 ] && status=1
          done
          done
          echo "DONE at $(date +%s)" | tee -a ../out/timing.txt
          grep RESULT ../out/drive.log || true
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.runner }}-${{ matrix.lang }}-${{ matrix.attempt }}
          path: out
          include-hidden-files: true
          overwrite: true
