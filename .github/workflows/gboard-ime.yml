name: gboard-ime

on:
  push:
  workflow_dispatch:
    inputs:
      locale:
        description: Extra emulator option, e.g. "-change-locale ja-JP" (needs su, which Play images lack). Empty for English.
        default: ''
      langs:
        description: Languages for the keyboard action probe, space-separated. Each runs as its own job, twice.
        default: 'ko zh hi ar he th vi de en'
      pages:
        description: Pages for the probe, space-separated. editor is the Portable Text Editor page, plain a bare contenteditable control. Each job runs every page.
        default: 'editor plain'

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # baseline = the published @portabletext/editor in page/package.json (8.2.10), the others are packed tarballs in page/tarballs.
        variant: [npm-1.57.5]
        lang: [ja]
        api: [36]
        attempt: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: KVM probe
        run: |
          ls -l /dev/kvm || echo "NO /dev/kvm"
          grep -cE 'vmx|svm' /proc/cpuinfo || true

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build test page
        working-directory: page
        run: |
          case "${{ matrix.variant }}" in
            baseline) ;;
            npm-*) v="${{ matrix.variant }}"; npm pkg set "dependencies.@portabletext/editor=${v#npm-}" ;;
            *) npm pkg set "dependencies.@portabletext/editor=file:tarballs/${{ matrix.variant }}.tgz" ;;
          esac
          npm install --no-audit --no-fund --no-package-lock && npm run build
          node -e "console.log('EDITOR_VERSION', require('./node_modules/@portabletext/editor/package.json').version)"

      - name: Install the driver and fetch the uiautomator2 server jar
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          node --test scripts/test/*.test.ts
          node scripts/fetch-u2-jar.ts

      - name: Record start
        run: mkdir -p out && echo "EMULATOR_START at $(date +%s)" | tee out/timing.txt

      - name: Run on emulator
        id: run1
        continue-on-error: true
        timeout-minutes: 16
        env:
          IME_LANG: ${{ matrix.lang }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          cores: 4
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim ${{ inputs.locale }}
          script: scripts/run-on-device.sh

      # The emulator sometimes never comes online. Retry once, but only when it never booted.
      - name: Check boot
        id: boot
        if: steps.run1.outcome == 'failure'
        run: |
          if grep -q BOOTED out/timing.txt; then echo booted=yes >> $GITHUB_OUTPUT; else echo booted=no >> $GITHUB_OUTPUT; echo "BOOT_RETRY"; fi

      - name: Run on emulator (boot retry)
        if: steps.run1.outcome == 'failure' && steps.boot.outputs.booted == 'no'
        timeout-minutes: 16
        env:
          IME_LANG: ${{ matrix.lang }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          cores: 4
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim ${{ inputs.locale }}
          script: scripts/run-on-device.sh

      - name: Fail when the first run failed after booting
        if: steps.run1.outcome == 'failure' && steps.boot.outputs.booted == 'yes'
        run: exit 1

      - name: Boot time
        if: always()
        run: |
          s=$(grep EMULATOR_START out/timing.txt | awk '{print $3}')
          b=$(grep BOOTED out/timing.txt | awk '{print $3}')
          [ -n "$s" ] && [ -n "$b" ] && echo "BOOT_SECONDS $((b - s))"
          grep RESULT out/drive.log || true
          cat out/phases.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.variant }}-${{ matrix.lang }}-api${{ matrix.api }}-${{ matrix.attempt }}
          path: out/

  # The keyboard action probe, on dispatch only. It runs beside the jobs above and leaves them as they are.
  probe-langs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      langs: ${{ steps.split.outputs.langs }}
    steps:
      - id: split
        env:
          LANGS: ${{ inputs.langs }}
        run: echo "langs=$(printf '%s\n' $LANGS | jq -Rnc '[inputs | select(length > 0)]')" | tee -a "$GITHUB_OUTPUT"

  probe:
    needs: probe-langs
    if: needs.probe-langs.outputs.langs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        lang: ${{ fromJSON(needs.probe-langs.outputs.langs) }}
        attempt: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build test page
        working-directory: page
        run: |
          npm install --no-audit --no-fund --no-package-lock && npm run build
          cat dist/versions.json

      - name: Install the driver and fetch the uiautomator2 server jar
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          node --test scripts/test/*.test.ts
          node scripts/fetch-u2-jar.ts

      - name: Record start
        run: mkdir -p out && echo "EMULATOR_START at $(date +%s)" | tee out/timing.txt

      - name: Probe on emulator
        timeout-minutes: 50
        env:
          PROBE_LANG: ${{ matrix.lang }}
          PROBE_PAGES: ${{ inputs.pages }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          ram-size: 4096M
          cores: 4
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: scripts/run-on-device.sh

      - name: Summary
        if: always()
        run: |
          grep -hE '^SETUP .* (CURSOR_CONTROL|subtypes|enabled|download|tiles|layout|done)' out/setup.log || true
          grep -hE '^PROBE' out/probe.log || true
          cat out/phases.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.lang }}-${{ matrix.attempt }}
          path: out/
